# No network, torch, GPU or API key is needed: the HF tests use local tokenizer fixtures.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday: catch dependency or runtime drift
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run prefcheck examples/conversational.jsonl --max-length 64 --fail-on never
      - run: uv build
